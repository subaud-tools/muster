# tools-common is the family's shared Go module; take each release as a PR
# into dev, where changes are tested before a release promotes them to main.
# Other dependencies are updated by hand.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: dev
    schedule:
      interval: daily
    # Dependabot holds a new release for 3 days by default (cooldown days
    # must be 1-90, so 0 is not allowed); tools-common is ours and ships
    # several releases a day, so exclude it and take each release at once.
    cooldown:
      default-days: 3
      exclude:
        - github.com/subaud-tools/tools-common*
    allow:
      - dependency-name: github.com/subaud-tools/tools-common*
    commit-message:
      prefix: "chore(deps)"
  # The family release (and CI) actions: take each tools-actions release as a
  # PR into dev, like tools-common.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    allow:
      - dependency-name: "subaud-tools/tools-actions"
