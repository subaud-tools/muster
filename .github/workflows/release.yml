name: release

# Merge to main = release, through the family release actions
# (subaud-tools/tools-actions: release-version + go-release). The VERSION file is
# the knob: when a merge lands on main and no tag v<VERSION> exists yet, the
# release is cut, signed, notarized, stamp-checked, published to GitHub and
# to muster.tools/dl (moving /dl/muster/latest). A merge that doesn't bump
# VERSION releases nothing.
#
# MUSTER-SPECIFIC:
#   - muster-deploy, the hosted backend's installer, ships SEPARATELY from the
#     device tarballs (it links the AWS SDK; bundling it would put AWS code in
#     the download every device unpacks). It has no `version` command, so only
#     `muster` is stamp-checked (go-release runs only what stamp-check lists).
#   - The Lambda zip for the optional hosted backend
#     (contrib/cloudformation/muster-backend.yaml) is built before go-release
#     into dist/ and attached as an extra asset. Three things about it are
#     load-bearing: -tags lambda (without it runLambda is the stub and the
#     function dies at every cold start), the name `bootstrap` (what
#     provided.al2023 execs), and linux/arm64 (Architectures: [arm64]). Its
#     file name carries the tag because CloudFormation only redeploys Lambda
#     code when the S3 key changes.
#
# workflow_dispatch does two things, chosen by whether `tag` is given:
#   - tag set    -> rebuild assets for that EXISTING release (backfill/repair).
#   - tag empty  -> cut a PRE-RELEASE from the branch you dispatch on, tagged
#                   v<VERSION>-rc.<run>: the dev channel. It publishes its
#                   versioned /dl paths but never becomes "Latest".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild assets for. Leave EMPTY to cut a pre-release from this branch."
        required: false
        default: ""

permissions:
  contents: write
  # OIDC: go-release assumes the tools-ops Release role to write to the
  # muster.tools Downloads bucket. Trust is this repo's `release` environment.
  id-token: write

jobs:
  release:
    runs-on: macos-26
    # The signing secrets live in this protected environment.
    environment: release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - id: rel
        uses: subaud-tools/tools-actions/release-version@v0.11.0
        with:
          mode: version-file
          dispatch-tag: ${{ inputs.tag }}
      - if: steps.rel.outputs.skip != 'true'
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the Lambda zip
        if: steps.rel.outputs.skip != 'true'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          V: ${{ steps.rel.outputs.version }}
          C: ${{ steps.rel.outputs.commit }}
          D: ${{ steps.rel.outputs.date }}
        run: |
          set -euo pipefail
          pkg=github.com/subaud-tools/muster/internal/version
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags lambda -trimpath \
            -ldflags "-s -w -X $pkg.version=$V -X $pkg.commit=$C -X $pkg.date=$D" \
            -o dist/bootstrap ./cmd/muster
          (cd dist && zip -qj "muster-lambda-arm64-${TAG}.zip" bootstrap && rm bootstrap)
      - if: steps.rel.outputs.skip != 'true'
        uses: subaud-tools/tools-actions/go-release@v0.11.0
        with:
          setup-go: "false"
          binaries: |
            muster=./cmd/muster
            muster-deploy=./cmd/muster-deploy
          ldflags: >-
            -X github.com/subaud-tools/muster/internal/version.version={version}
            -X github.com/subaud-tools/muster/internal/version.commit={commit}
            -X github.com/subaud-tools/muster/internal/version.date={date}
          stamp-check: muster
          extra-assets: dist/*.zip
          tag: ${{ steps.rel.outputs.tag }}
          version: ${{ steps.rel.outputs.version }}
          commit: ${{ steps.rel.outputs.commit }}
          date: ${{ steps.rel.outputs.date }}
          create: ${{ steps.rel.outputs.create }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          release-title: muster ${{ steps.rel.outputs.tag }}
          apple-developer-id-p12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          apple-developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          apple-notary-key: ${{ secrets.APPLE_NOTARY_KEY }}
          apple-notary-key-id: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          apple-notary-issuer-id: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          dl-tool: muster
          dl-role-arn: ${{ vars.MUSTER_RELEASE_ROLE_ARN }}
          dl-bucket: ${{ vars.MUSTER_DOWNLOADS_BUCKET }}
          dl-distribution-id: ENNIY7RSDS2NI
