[[findings]]
  id = "F-002"
  waste = "W5"
  location = "workflow:.github/workflows/ci.yml/job:gate/step:Run schuettc%2Ftools-actions%2Fgo-ci@v0.10.1"
  recipe = "R5"
  basis = "measured"
  estimate = "Duplication measured; saving suspected: ~50s off the critical path if the 4 targets were split across the two legs (half of a cold ~105s cross-build; per-target times are not in the logs, so unproven); a few seconds once the ubuntu cache is warm (macOS warm cross-build 11s). Effort: small, but the fix belongs upstream in schuettc/tools-actions go-ci. REFRESHED 2026-10-31, n=30 runs: subtracting the macOS cross-build from each critical path saves a mean of 30.3s, median 41.5s when macOS is cold and 8.5s when warm; arithmetic from logs, not a measured run. Deferred by the repo owner (Later) on 2026-10-31."
  risk = "The family-standard ci.yml must be identical across repos except branch and OS lists, so per-repo, per-leg target lists are forbidden; an upstream go-ci change affects every family repo. Both gate legs must stay required checks."
  status = "open"
  pr = ""
  exemption-id = ""

