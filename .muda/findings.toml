[[findings]]
  id = "F-001"
  waste = "W4"
  location = "workflow:.github/workflows/ci.yml/job:gate"
  recipe = "R11"
  basis = "suspected"
  estimate = "Saving: up to ~3 min off CI's critical path per run that restores a warm Linux entry; low confidence, basis is one same-run cross-runner-type comparison (run 36625609989: gate ubuntu-26.04 285s on extra's entry vs gate macos-26 94s on its own full entry); runs that miss the cache gain nothing; dynamo (~90s) would likely become the critical path. Effort: small (ci.yml setup-go cache inputs plus deleting the main-scope Linux 66da80 entry). APPROVED AS AN EXPERIMENT (repo owner, 2026-10-02): basis stays suspected; approval does not upgrade it to measured. Fix under test: `cache: false` on setup-go in both `extra` and `dynamo` (extra alone would let dynamo win the race next), so gate (ubuntu-26.04) is the only Linux writer; delete the main-scope near-empty Linux entry right after the PR opens. Pass criteria, all verified on the PR's real pipeline with run IDs: (a) gate (ubuntu-26.04) saves a full entry; (b) a later run on a NEW commit (not a re-run of the same commit, since Go's test cache would inflate it) restores that entry and the ubuntu gate's go-ci step is clearly faster than the ~285s baseline (run 36625609989), reported phase by phase for vet, race test and cross-build; (c) dynamo without its cache does not become CI's new critical path, or if it does, the net change in total CI time is reported; (d) the gate inventory is unchanged. If the experiment does not hold up, the PR is closed and the finding is revisited."
  risk = "extra and dynamo lose cache writes; extra is in the family-standard ci.yml; deleting a cache entry is a repository write; the race recurs on the next go.sum key change unless only the gate can save the Linux key. Required checks and jobs must not be dropped or renamed."
  status = "in-pr"
  pr = "https://github.com/schuettc/muster/pull/176"
  exemption-id = ""

